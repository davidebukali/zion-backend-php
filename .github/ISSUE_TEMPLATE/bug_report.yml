name: 🐛 Bug Report
description: Create a report to help us improve Zion Backend
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Before reporting, please search existing issues to see if it has already been reported.
  - type: input
    id: module
    attributes:
      label: Affected Module
      description: Which module does this bug affect? (e.g. Auth, Posts, SocialGraph, Notifications, Media, etc.)
      placeholder: "e.g. Modules/Posts"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Send POST request to '/api/v1/...'
        2. With payload '...'
        3. See error response
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack Trace
      description: Paste any relevant output from `storage/logs/laravel.log` or console output.
      render: shell
