name: zion

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - ALL
  logging: *logging
  restart: unless-stopped

x-laravel: &laravel
  <<: *hardening
  init: true
  image: zion/app:${APP_TAG:-latest}
  env_file:
    - .env
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: https://tsiyonapp.com
    DB_HOST: db
    REDIS_HOST: redis
    REVERB_HOST: reverb
    REVERB_PORT: "8080"
    REVERB_SCHEME: http
    LOG_STACK: "single,stderr"
  entrypoint: ["/usr/local/bin/entrypoint.sh"]
  cap_add:
    - CHOWN
    - FOWNER
    - DAC_OVERRIDE
    - SETGID
    - SETUID
  read_only: true
  tmpfs:
    - /tmp
    - /var/run
    - /var/www/bootstrap/cache:uid=82,gid=82,mode=775
  volumes:
    - storage:/var/www/storage
  networks:
    - backend
    - egress
  pids_limit: 512

services:
  caddy:
    <<: *hardening
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    mem_reservation: 48m
    mem_limit: 64m

  web:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    image: zion/web:${APP_TAG:-latest}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    volumes:
      - storage:/var/www/storage:ro
    depends_on:
      - app
    networks:
      - edge
      - backend
    mem_reservation: 48m
    mem_limit: 64m
    pids_limit: 128

  app:
    <<: *laravel
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    command: ["php-fpm"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_reservation: 192m
    mem_limit: 448m

  horizon:
    <<: *laravel
    command: ["/var/www/docker/horizon/entrypoint.sh"]
    stop_grace_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_reservation: 160m
    mem_limit: 384m

  scheduler:
    <<: *laravel
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_reservation: 48m
    mem_limit: 80m

  reverb:
    <<: *laravel
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    healthcheck:
      test: ["CMD-SHELL", "php -r \"@fsockopen('127.0.0.1', 8080) ? exit(0) : exit(1);\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy
    mem_reservation: 64m
    mem_limit: 128m

  db:
    <<: *hardening
    image: postgres:17-alpine
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-zionweb}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_connections=on
      - -c
      - log_min_duration_statement=1000
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-zionweb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    mem_reservation: 256m
    mem_limit: 448m
    stop_grace_period: 30s

  redis:
    <<: *hardening
    image: redis:7-alpine
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    mem_reservation: 48m
    mem_limit: 96m

volumes:
  postgres_data:
    name: zion_postgres_data
  redis_data:
    name: zion_redis_data
  storage:
    name: zion_storage_data
  caddy_data:
    name: zion_caddy_data
  caddy_config:
    name: zion_caddy_config

networks:
  edge: {}
  backend:
    internal: true
  egress: {}
