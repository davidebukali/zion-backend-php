services:
  # ---------------------------------------------------------------------------
  # InfluxDB (v1.8 Time-Series Storage for k6 metrics)
  # ---------------------------------------------------------------------------
  influxdb:
    image: influxdb:1.8-alpine
    platform: linux/amd64
    container_name: zion_loadtest_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
    volumes:
      - influxdb_data:/var/lib/influxdb
    networks:
      - zion_network

  # ---------------------------------------------------------------------------
  # Grafana Dashboard (Port 3000)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: zion_loadtest_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - influxdb
    networks:
      - zion_network

  # ---------------------------------------------------------------------------
  # k6 Load Generator (Optional container runner)
  # ---------------------------------------------------------------------------
  k6:
    image: grafana/k6:latest
    container_name: zion_loadtest_k6
    profiles: ["runner"]
    volumes:
      - ./scripts:/scripts
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
    networks:
      - zion_network

volumes:
  influxdb_data:
    driver: local

networks:
  zion_network:
    name: zion_network

