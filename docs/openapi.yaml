openapi: 3.0.3
info:
  title: 'Tsiyon API Documentation'
  description: ''
  version: 1.0.0
servers:
  - url: 'http://localhost'
tags:
  - name: Authentication
    description: ''
  - name: Churches
    description: ''
  - name: Comments
    description: ''
  - name: Endpoints
    description: ''
  - name: Interactions
    description: ''
  - name: 'Media Management'
    description: ''
  - name: Messages
    description: ''
  - name: Notifications
    description: ''
  - name: Posts
    description: ''
  - name: Profiles
    description: ''
  - name: Search
    description: ''
  - name: 'Social Graph'
    description: ''
paths:
  /api/v1/register:
    post:
      summary: ''
      operationId: postApiV1Register
      description: ''
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    user:
                      id: 1
                      name: 'Jane Doe'
                      email: jane@example.com
                    token: 1|sanctum_token_string
                  message: 'User registered successfully'
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'Jane Doe'
                          email:
                            type: string
                            example: jane@example.com
                      token:
                        type: string
                        example: 1|sanctum_token_string
                  message:
                    type: string
                    example: 'User registered successfully'
        422:
          description: 'Validation error'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The email has already been taken.'
                  errors:
                    email:
                      - 'The email has already been taken.'
                properties:
                  message:
                    type: string
                    example: 'The email has already been taken.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email has already been taken.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "The user's full name."
                  example: 'Jane Doe'
                  nullable: true
                email:
                  type: string
                  description: "The user's unique email address."
                  example: jane@example.com
                password:
                  type: string
                  description: 'The account password (min 8 characters).'
                  example: secret123
                account_type:
                  type: string
                  description: ''
                  example: individual
                  enum:
                    - individual
                    - organization
                  nullable: true
                category:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: a
                  nullable: true
                location:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'y'
                  nullable: true
                church_id:
                  type: string
                  description: 'Must match an existing stored value.'
                  example: architecto
                  nullable: true
                church_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
                  nullable: true
                church_location:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: g
                  nullable: true
              required:
                - name
                - email
                - password
      security: []
  /api/v1/login:
    post:
      summary: ''
      operationId: postApiV1Login
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    token: 1|sanctum_token_string
                  message: 'Logged in successfully'
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: 1|sanctum_token_string
                  message:
                    type: string
                    example: 'Logged in successfully'
        401:
          description: 'Invalid credentials'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Invalid login credentials.'
                properties:
                  message:
                    type: string
                    example: 'Invalid login credentials.'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: "The user's registered email address."
                  example: jane@example.com
                password:
                  type: string
                  description: 'The account password.'
                  example: secret123
              required:
                - email
                - password
      security: []
  /api/v1/forgot-password:
    post:
      summary: ''
      operationId: postApiV1ForgotPassword
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Password reset code has been sent to your email.'
                properties:
                  message:
                    type: string
                    example: 'Password reset code has been sent to your email.'
        422:
          description: 'Email not found'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'We could not find an account with this email address.'
                  errors:
                    email:
                      - 'We could not find an account with this email address.'
                properties:
                  message:
                    type: string
                    example: 'We could not find an account with this email address.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'We could not find an account with this email address.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: "The user's registered email address."
                  example: jane@example.com
              required:
                - email
      security: []
  /api/v1/verify-code:
    post:
      summary: ''
      operationId: postApiV1VerifyCode
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Verification code confirmed. You may now reset your password.'
                properties:
                  message:
                    type: string
                    example: 'Verification code confirmed. You may now reset your password.'
        422:
          description: 'Invalid or expired code'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The verification code has expired. Please request a new one.'
                  errors:
                    code:
                      - 'The verification code has expired. Please request a new one.'
                properties:
                  message:
                    type: string
                    example: 'The verification code has expired. Please request a new one.'
                  errors:
                    type: object
                    properties:
                      code:
                        type: array
                        example:
                          - 'The verification code has expired. Please request a new one.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: "The user's registered email address."
                  example: jane@example.com
                code:
                  type: string
                  description: 'The 6-digit verification code.'
                  example: '482910'
              required:
                - email
                - code
      security: []
  /api/v1/reset-password:
    post:
      summary: ''
      operationId: postApiV1ResetPassword
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Password has been reset successfully.'
                properties:
                  message:
                    type: string
                    example: 'Password has been reset successfully.'
        422:
          description: 'Verification expired or mismatch'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Verification code was not verified or verification session has expired. Please request a new code.'
                  errors:
                    email:
                      - 'Verification code was not verified or verification session has expired. Please request a new code.'
                properties:
                  message:
                    type: string
                    example: 'Verification code was not verified or verification session has expired. Please request a new code.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'Verification code was not verified or verification session has expired. Please request a new code.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: "The user's registered email address."
                  example: jane@example.com
                password:
                  type: string
                  description: 'The new password (min 8 characters).'
                  example: newSecret123
                password_confirmation:
                  type: string
                  description: 'Must match password.'
                  example: newSecret123
              required:
                - email
                - password
                - password_confirmation
      security: []
  /api/v1/me:
    get:
      summary: ''
      operationId: getApiV1Me
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'Jane Doe'
                    email: jane@example.com
                    created_at: '2026-09-24T12:00:00.000000Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Jane Doe'
                      email:
                        type: string
                        example: jane@example.com
                      created_at:
                        type: string
                        example: '2026-09-24T12:00:00.000000Z'
        401:
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Authentication
  /api/v1/churches:
    get:
      summary: "List Churches\n\nRetrieve a paginated list of predetermined and community-added churches, with optional search filtering."
      operationId: listChurchesRetrieveAPaginatedListOfPredeterminedAndCommunityAddedChurchesWithOptionalSearchFiltering
      description: ''
      parameters:
        -
          in: query
          name: search
          description: 'Filter churches by name or location.'
          example: Watoto
          required: false
          schema:
            type: string
            description: 'Filter churches by name or location.'
            example: Watoto
        -
          in: query
          name: per_page
          description: 'Number of items per page (default: 50, max: 100).'
          example: 50
          required: false
          schema:
            type: integer
            description: 'Number of items per page (default: 50, max: 100).'
            example: 50
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Churches retrieved successfully.'
                  data:
                    -
                      id: 01j98z3q4x6y7w8v9u0t1s2c01
                      name: 'Watoto Church'
                      location: Uganda
                      created_at: '2026-11-02T20:00:00.000000Z'
                      updated_at: '2026-11-02T20:00:00.000000Z'
                  meta:
                    current_page: 1
                    from: 1
                    last_page: 1
                    per_page: 50
                    to: 1
                    total: 1
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Churches retrieved successfully.'
                  data:
                    type: array
                    example:
                      - id: 01j98z3q4x6y7w8v9u0t1s2c01
                        name: 'Watoto Church'
                        location: Uganda
                        created_at: '2026-11-02T20:00:00.000000Z'
                        updated_at: '2026-11-02T20:00:00.000000Z'
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 01j98z3q4x6y7w8v9u0t1s2c01
                        name:
                          type: string
                          example: 'Watoto Church'
                        location:
                          type: string
                          example: Uganda
                        created_at:
                          type: string
                          example: '2026-11-02T20:00:00.000000Z'
                        updated_at:
                          type: string
                          example: '2026-11-02T20:00:00.000000Z'
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      from:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 50
                      to:
                        type: integer
                        example: 1
                      total:
                        type: integer
                        example: 1
      tags:
        - Churches
      security: []
  '/api/v1/posts/{post_id}/comments':
    post:
      summary: ''
      operationId: postApiV1PostsPost_idComments
      description: ''
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Comment created successfully'
                  data:
                    id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                    content: 'Great post!'
                    created_at: '2026-09-24T12:00:00.000000Z'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Comment created successfully'
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                      content:
                        type: string
                        example: 'Great post!'
                      created_at:
                        type: string
                        example: '2026-09-24T12:00:00.000000Z'
      tags:
        - Comments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: 'The text content of the comment.'
                  example: 'Great post!'
                media_ids:
                  type: array
                  description: 'Optional attached media UUIDs.'
                  example:
                    - 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                  items:
                    type: string
                parent_comment_id:
                  type: string
                  description: 'Optional parent comment UUID if creating a reply directly.'
                  example: null
                  nullable: true
              required:
                - content
    get:
      summary: ''
      operationId: getApiV1PostsPost_idComments
      description: ''
      parameters:
        -
          in: query
          name: per_page
          description: 'Items per page.'
          example: 15
          required: false
          schema:
            type: integer
            description: 'Items per page.'
            example: 15
        -
          in: query
          name: page
          description: 'Page number.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number.'
            example: 1
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    -
                      id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                      content: 'Great post!'
                      user:
                        id: 1
                        name: 'Jane Doe'
                      created_at: '2026-09-24T12:00:00.000000Z'
                  meta:
                    links:
                      first: ...
                      last: ...
                      prev: null
                      next: null
                    meta:
                      current_page: 1
                      from: 1
                      last_page: 1
                      per_page: 15
                      to: 1
                      total: 1
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    example:
                      -
                        id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                        content: 'Great post!'
                        user:
                          id: 1
                          name: 'Jane Doe'
                        created_at: '2026-09-24T12:00:00.000000Z'
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                        content:
                          type: string
                          example: 'Great post!'
                        user:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: 'Jane Doe'
                        created_at:
                          type: string
                          example: '2026-09-24T12:00:00.000000Z'
                  meta:
                    type: object
                    properties:
                      links:
                        type: object
                        properties:
                          first:
                            type: string
                            example: ...
                          last:
                            type: string
                            example: ...
                          prev:
                            type: string
                            example: null
                            nullable: true
                          next:
                            type: string
                            example: null
                            nullable: true
                      meta:
                        type: object
                        properties:
                          current_page:
                            type: integer
                            example: 1
                          from:
                            type: integer
                            example: 1
                          last_page:
                            type: integer
                            example: 1
                          per_page:
                            type: integer
                            example: 15
                          to:
                            type: integer
                            example: 1
                          total:
                            type: integer
                            example: 1
      tags:
        - Comments
    parameters:
      -
        in: path
        name: post_id
        description: 'The ID of the post.'
        example: 01m3pbp55bam0h7zc306a9vnst
        required: true
        schema:
          type: string
      -
        in: path
        name: post
        description: 'The ID of the post.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/comments/{id}':
    patch:
      summary: ''
      operationId: patchApiV1CommentsId
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Comment updated successfully'
                  data:
                    id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                    content: 'Updated comment text!'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Comment updated successfully'
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                      content:
                        type: string
                        example: 'Updated comment text!'
        403:
          description: 'Unauthorized update'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This action is unauthorized.'
                properties:
                  message:
                    type: string
                    example: 'This action is unauthorized.'
      tags:
        - Comments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: 'Updated comment text.'
                  example: 'Updated comment text!'
              required:
                - content
    delete:
      summary: ''
      operationId: deleteApiV1CommentsId
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Comment deleted successfully'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Comment deleted successfully'
        403:
          description: 'Unauthorized deletion'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This action is unauthorized.'
                properties:
                  message:
                    type: string
                    example: 'This action is unauthorized.'
      tags:
        - Comments
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the comment.'
        example: 01m3rv500tztft6zjf50ae7cm0
        required: true
        schema:
          type: string
      -
        in: path
        name: comment
        description: 'The UUID of the comment.'
        example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        required: true
        schema:
          type: string
  '/api/v1/comments/{comment_id}/replies':
    post:
      summary: ''
      operationId: postApiV1CommentsComment_idReplies
      description: ''
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Reply created successfully'
                  data:
                    id: 9c2eeb4d-3b7d-4bad-9bdd-2b0d7b3dcb6e
                    content: 'I completely agree!'
                    parent_comment_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Reply created successfully'
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 9c2eeb4d-3b7d-4bad-9bdd-2b0d7b3dcb6e
                      content:
                        type: string
                        example: 'I completely agree!'
                      parent_comment_id:
                        type: string
                        example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
      tags:
        - Comments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: 'Reply text content.'
                  example: 'I completely agree!'
              required:
                - content
    get:
      summary: ''
      operationId: getApiV1CommentsComment_idReplies
      description: ''
      parameters:
        -
          in: query
          name: per_page
          description: 'Items per page.'
          example: 15
          required: false
          schema:
            type: integer
            description: 'Items per page.'
            example: 15
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    -
                      id: 9c2eeb4d-3b7d-4bad-9bdd-2b0d7b3dcb6e
                      content: 'I completely agree!'
                      parent_comment_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                      created_at: '2026-09-24T12:00:00.000000Z'
                  meta:
                    links:
                      first: ...
                      last: ...
                      prev: null
                      next: null
                    meta:
                      current_page: 1
                      from: 1
                      last_page: 1
                      per_page: 15
                      to: 1
                      total: 1
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    example:
                      - id: 9c2eeb4d-3b7d-4bad-9bdd-2b0d7b3dcb6e
                        content: 'I completely agree!'
                        parent_comment_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                        created_at: '2026-09-24T12:00:00.000000Z'
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 9c2eeb4d-3b7d-4bad-9bdd-2b0d7b3dcb6e
                        content:
                          type: string
                          example: 'I completely agree!'
                        parent_comment_id:
                          type: string
                          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                        created_at:
                          type: string
                          example: '2026-09-24T12:00:00.000000Z'
                  meta:
                    type: object
                    properties:
                      links:
                        type: object
                        properties:
                          first:
                            type: string
                            example: ...
                          last:
                            type: string
                            example: ...
                          prev:
                            type: string
                            example: null
                            nullable: true
                          next:
                            type: string
                            example: null
                            nullable: true
                      meta:
                        type: object
                        properties:
                          current_page:
                            type: integer
                            example: 1
                          from:
                            type: integer
                            example: 1
                          last_page:
                            type: integer
                            example: 1
                          per_page:
                            type: integer
                            example: 15
                          to:
                            type: integer
                            example: 1
                          total:
                            type: integer
                            example: 1
